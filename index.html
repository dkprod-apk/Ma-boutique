<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1f5fb;--card:#ffffff;--tx:#11213f;--mut:#5f6f8c;--pri:#1e40af;--pri2:#3b6fe0;--acc:#f5b324;--ok:#13795b;--bad:#c0392b;--line:#dbe3f1;--sh:0 4px 16px rgba(30,64,175,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1630;--card:#122249;--tx:#eaf0ff;--mut:#9fb0d6;--pri:#8fb1ff;--pri2:#5f8cf0;--acc:#f5b324;--ok:#4cc9a0;--bad:#ff8a80;--line:#243a6e;--sh:0 4px 16px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0b1630;--card:#122249;--tx:#eaf0ff;--mut:#9fb0d6;--pri:#8fb1ff;--pri2:#5f8cf0;--acc:#f5b324;--ok:#4cc9a0;--bad:#ff8a80;--line:#243a6e;--sh:0 4px 16px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Sora,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px;min-height:100vh}
body.gate{padding-bottom:0}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0a1f55,#2c57cc);color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 12px rgba(0,0,0,.2)}
.topbar:after{content:none}
.tb-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.dkm{height:40px;width:auto;display:block;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}.brand #logo{display:flex;flex:none;padding-right:10px;margin-right:2px;border-right:1px solid rgba(255,255,255,.22)}.dkh{height:84px;width:auto;display:block;margin:0 auto;position:relative}.dka{display:block;width:100%;height:auto;margin:0 auto}.lg-l{display:none}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-d{display:none}:root:not([data-theme="light"]) .lg-l{display:block}}:root[data-theme="dark"] .lg-d{display:none}:root[data-theme="dark"] .lg-l{display:block}
.brand b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:17px;font-weight:800;line-height:1.2;overflow:hidden}
.brand{flex:1 1 auto;overflow:hidden}.brand>div:last-child{min-width:0;overflow:hidden}#tbr{flex:none}.brand small{display:block;font-size:12px;opacity:.8;text-transform:capitalize}
.pill{display:inline-block;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);white-space:nowrap}
.pill.warn{background:var(--acc);color:#161a33;border-color:var(--acc);font-weight:600}
.layout{max-width:1100px;margin:0 auto;display:block}
main{padding:14px;max-width:760px;margin:0 auto}
.banner{max-width:760px;margin:12px auto 0;padding:0 14px}
.banner div+div{margin-top:8px}.banner .bkn{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;font-size:13px}.banner .bkn span{flex:1;line-height:1.3}.banner .bkn button{border:0;border-radius:8px;padding:7px 11px;font-weight:700;font-size:13px;font-family:inherit;background:#6b4b00;color:#fff;cursor:pointer}.banner .bkn .x{background:transparent;color:#6b4b00;font-size:20px;line-height:1;padding:2px 8px}.banner div{background:#fff4d6;color:#6b4b00;border:1px solid #f0cf7a;border-radius:12px;padding:10px 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.big{font-size:34px;font-weight:800;color:var(--pri);line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.grid{margin-bottom:12px}
.k{font-size:12px;color:var(--mut)}.v{font-size:18px;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
input,select,button{font:inherit;color:var(--tx)}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer;transition:transform .1s;box-shadow:0 2px 6px rgba(30,64,175,.25)}
:root:not([data-theme="light"]) .btn{color:#0a1530}
.btn:active{transform:scale(.97)}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--line);box-shadow:none}.btn.w{width:100%}.btn.r{background:var(--bad);color:#fff}
.btn.gold{background:var(--acc);color:#161a33}
a.btn{display:block;text-align:center;text-decoration:none}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row>div:first-child{flex:1;min-width:0}.row:active{background:var(--bg)}
.row b{display:block;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qty{display:flex;gap:6px;align-items:center}.qty button{width:34px;height:34px;padding:0}
.sel{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);border-radius:18px 18px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.1)}
body.gate nav{display:none}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:11px;color:var(--mut);cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--pri);font-weight:600;box-shadow:inset 0 3px 0 var(--acc)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;display:none;z-index:99}
textarea{width:100%;height:90px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);padding:8px;font:12px monospace}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.modal{position:fixed;inset:0;background:rgba(10,14,40,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}.modal .card{width:100%;max-width:420px;margin:0;max-height:calc(100vh - 32px);overflow-y:auto}
pre{white-space:pre-wrap;font:13px/1.5 monospace;background:var(--bg);padding:10px;border-radius:10px;margin:0}
.hero{background:linear-gradient(135deg,#1e40af,#3b6fe0);border:0;color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-20px;top:-20px;width:130px;height:130px;background:repeating-conic-gradient(#e8a317 0 25%,transparent 0 50%) 0 0/24px 24px;opacity:.25;border-radius:50%}
.hero .big,.hero .k{color:#fff}.hero .k{opacity:.85}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.qa .btn{padding:14px}
footer .by{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px;font-weight:600}footer .by .dka{width:96px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px 16px 6px}
/* ---- Page d'accueil / activation ---- */
.lp-hero{background:linear-gradient(135deg,#0a1f55,#2c57cc 60%,#3b6fe0);color:#fff;text-align:center;padding:44px 20px 56px;position:relative;overflow:hidden}
.lp-hero:before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(rgba(232,163,23,.12) 0 25%,transparent 0 50%) 0 0/48px 48px}
.lp-hero>*{position:relative}
.lp-hero svg{width:84px;height:84px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.lp-hero h1{font-size:30px;line-height:1.15;margin:14px auto 10px;font-weight:800;max-width:560px}
.lp-hero p{max-width:520px;margin:0 auto 22px;opacity:.88;font-size:15px}
.lp-hero .btn{display:inline-block;width:auto;padding:13px 26px;font-size:16px}
.lp{max-width:1000px;margin:0 auto;padding:0 14px}
.lp h3{text-align:center;font-size:22px;margin:34px 0 6px;font-weight:800}
.lp .sub{text-align:center;color:var(--mut);margin:0 0 18px;font-size:14px}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.feat i{font-style:normal;font-size:28px;display:block;margin-bottom:6px}.feat b{display:block;margin-bottom:2px}.feat span{font-size:13px;color:var(--mut)}
.steps{display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}

/* ======== ANIMATIONS & DÉCOR BOUTIQUE ======== */
:root{--gold:#f5b324;--cream:#fff6dc}
/* Auvent de boutique rayé */
.topbar{overflow:visible}
.topbar:after{content:""!important;position:absolute;left:-4px;right:-4px;top:100%;height:15px;z-index:29;pointer-events:none;
 background:repeating-linear-gradient(90deg,var(--gold) 0 22px,var(--cream) 22px 44px);
 -webkit-mask:radial-gradient(circle at 50% 0,#000 10.6px,transparent 11.2px) 0 0/22px 15px repeat-x;mask:radial-gradient(circle at 50% 0,#000 10.6px,transparent 11.2px) 0 0/22px 15px repeat-x;
 filter:drop-shadow(0 4px 3px rgba(0,0,0,.22));transform-origin:top center;animation:awn 6s ease-in-out infinite}
@keyframes awn{0%,100%{transform:skewX(0)}50%{transform:skewX(-.9deg) translateX(2px)}}
main#v{margin-top:18px}
/* Splash d'ouverture */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--fr);transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-in{text-align:center;color:#fff}
#splash svg{width:78px;height:78px;color:var(--gold);animation:bagJump 1s cubic-bezier(.3,1.6,.5,1) both}
#splash b{display:block;margin-top:14px;font-size:24px;font-weight:800;letter-spacing:.3px;animation:rise .6s .25s both}
#splash i{display:block;width:120px;height:4px;margin:16px auto 0;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
#splash i:after{content:"";display:block;height:100%;width:40%;border-radius:9px;background:var(--gold);animation:ld 1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes bagJump{0%{transform:translateY(-60px) scale(.5);opacity:0}60%{transform:translateY(6px) scale(1.08);opacity:1}100%{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* Entrée des écrans (une seule séquence orchestrée à chaque changement d'onglet) */
main#v.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
main#v.enter>*:nth-child(2){animation-delay:.07s}main#v.enter>*:nth-child(3){animation-delay:.14s}main#v.enter>*:nth-child(4){animation-delay:.21s}main#v.enter>*:nth-child(5){animation-delay:.28s}main#v.enter>*:nth-child(n+6){animation-delay:.34s}
main#v.enter .sg .sc{animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
main#v.enter .sg .sc:nth-child(2){animation-delay:.1s}main#v.enter .sg .sc:nth-child(3){animation-delay:.2s}main#v.enter .sg .sc:nth-child(4){animation-delay:.3s}
@keyframes pop{0%{opacity:0;transform:scale(.8) translateY(14px)}100%{opacity:1;transform:none}}
/* Hero : lumière dorée, objets flottants, panneau OUVERT */
.hero2{position:relative;overflow:hidden}
.hero2>*{position:relative;z-index:2}

.chart i{transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.9,.3,1) both}.chart div:nth-child(2) i{animation-delay:.06s}.chart div:nth-child(3) i{animation-delay:.12s}.chart div:nth-child(4) i{animation-delay:.18s}.chart div:nth-child(5) i{animation-delay:.24s}.chart div:nth-child(n+6) i{animation-delay:.3s}

#cartc .ct-it{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--bg);border:1px solid var(--line);margin-bottom:8px}
#cartc .ct-it .pav{width:48px;height:48px;border-radius:14px;flex:none}
#cartc .ct-i{flex:1;min-width:0}#cartc .ct-i b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cartc .ct-i small{display:block;color:var(--mut);font-size:12.5px;margin-top:1px}
#cartc .ct-lt{font-weight:800;font-size:14px;color:var(--pri);margin-top:2px;display:block}
#cartc .ct-q{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
#cartc .ct-q button{width:34px;height:34px;min-height:0;border:0;border-radius:50%;background:var(--bg);color:var(--tx);font-size:19px;font-weight:700;cursor:pointer;padding:0;line-height:1}
#cartc .ct-q button:active{transform:scale(.9)}#cartc .ct-q b{min-width:26px;text-align:center;font-size:15px}
#cartc .ct-tot{display:flex;justify-content:space-between;align-items:center;margin:14px 0;padding:16px 18px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#1e40af,#3b6fe0);box-shadow:0 10px 24px rgba(30,64,175,.32)}
#cartc .ct-tot span{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
#cartc .ct-tot b{font-size:26px;font-weight:800;color:#fff}
#cartc .rn-lb{margin:12px 0 6px}
#cartc .ct-qk{display:flex;gap:8px;margin:-2px 0 6px;flex-wrap:wrap}
#cartc .ct-qk button{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
#cartc .ct-hint{display:none;margin:2px 0 8px;padding:9px 12px;border-radius:12px;font-size:13.5px;font-weight:700}
#cartc .ct-hint.ok{display:block;background:rgba(19,121,91,.14);color:var(--ok)}
#cartc .ct-hint.cr{display:block;background:rgba(245,179,36,.2);color:var(--tx)}
#cartc .ct-pm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
#cartc .ct-pm button{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:left;transition:border-color .2s,box-shadow .2s}
#cartc .ct-pm button.on{border-color:var(--pri2);background:rgba(59,111,224,.10);box-shadow:0 6px 16px rgba(59,111,224,.22)}
#cartc .ct-go{margin-top:6px;border-radius:18px;font-size:17px;padding:15px;background:linear-gradient(135deg,#13795b,#1fa67a)!important;color:#fff!important;box-shadow:0 10px 22px rgba(19,121,91,.35)}
#cartc .ct-emp{text-align:center;padding:26px 10px;color:var(--mut)}#cartc .ct-emp div{font-size:42px;margin-bottom:6px}
</style>

 function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
 var v0=g("bml_snd");if(v0!==null&&!isNaN(+v0))sel=+v0;
 Promise.resolve(idbGet("snd")).then(function(v){if(g("bml_snd")===null&&v!=null&&v!==""&&!isNaN(+v))sel=+v}).catch(function(){});
 function ctx(){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==="suspended")ac.resume()}catch(e){}return ac}
 ["pointerdown","keydown","touchstart"].forEach(function(ev){document.addEventListener(ev,ctx,{passive:true})});
 function tone(t,f,d,ty,v,f2){var o=ac.createOscillator(),a=ac.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.8);
  a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(v||.3,t+.012);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a);a.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
 var SN=[
  ["Cristal",function(t){tone(t,1319,.5,"sine",.3);tone(t+.13,1760,.7,"sine",.3)}],
  ["Goutte",function(t){tone(t,1200,.28,"sine",.38,500)}],
  ["Carillon",function(t){[1047,1319,1568].forEach(function(f,k){tone(t+k*.12,f,.6,"sine",.26);tone(t+k*.12,f*2,.35,"sine",.08)})}],
  ["Pop",function(t){tone(t,420,.12,"triangle",.4,900);tone(t+.09,760,.14,"triangle",.3,1100)}],
  ["Cloche",function(t){[[880,1.3,.3],[1760,1.1,.12],[2349,.9,.08]].forEach(function(q){tone(t,q[0],q[1],"sine",q[2])})}]];
 function play(i){try{if(i<0||!SN[i]||!ctx())return;SN[i][1](ac.currentTime+.04)}catch(e){}}
 function setSel(i){sel=i;put("bml_snd",String(i));try{idbPut("snd",String(i))}catch(e){}}
 window.mbSnd=function(i){setSel(i);play(i)};
 window.mbSndTry=function(i){play(i)};
 function row(i,l,on){return '<label style="display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer"><input type="radio" name="mbsnd" style="width:22px;height:22px;flex:none;margin:0;padding:0"'+(on?" checked":"")+' onchange="mbSnd('+i+')"><span style="flex:1;font-weight:600">'+l+'</span>'+(i>=0?'<button type="button" class="btn" style="flex:none;padding:6px 14px" onclick="event.preventDefault();event.stopPropagation();mbSndTry('+i+')">▶</button>':"")+'</label>'}
 window.sndCard=function(){var h='<div class="card"><h2>🔔 Son des notifications</h2><div class="k" style="margin-bottom:8px">Joué à chaque nouvelle alerte (stock bas, crédit à récupérer, licence qui expire…). Touchez ▶ pour écouter.</div>';
  SN.forEach(function(n,i){h+=row(i,n[0],sel===i)});return h+row(-1,"Sans son",sel===-1)+'</div>'};
 /* détection des nouvelles alertes (clés déjà signalées mémorisées ; au tout premier passage on mémorise sans sonner) */
 function chkN(){if(chk||!licensed||locked||sel<0)return;var keys=[],st=null;
  try{alertsNew().forEach(function(x){keys.push(alKey(x))})}catch(e){}
  try{if(lic&&lic.exp&&lic.exp!=="0"&&daysLeft(lic.exp)<=7)keys.push("lic|"+today())}catch(e){}
  try{st=JSON.parse(g("bml_snk")||"null")}catch(e){}
  var first=!Array.isArray(st);if(first)st=[];
  var fresh=keys.filter(function(k){return st.indexOf(k)<0});if(!fresh.length&&!first)return;
  put("bml_snk",JSON.stringify(st.concat(fresh).slice(-300)));if(!first&&fresh.length)play(sel)}
 var rb=render;render=function(){var r=rb.apply(this,arguments);try{clearTimeout(tt);tt=setTimeout(chkN,300)}catch(e){}return r};
})();
document.getElementById("mbh").src=MBS;
boot();
render();
</script>
